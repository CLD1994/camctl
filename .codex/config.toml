developer_instructions = """
对于 Multi-Agent V2：

`wait_agent` 是事件驱动的等待工具。收到子代理消息、完成通知或新的用户输入时，可以提前返回。

通用的“避免超过 60 秒的阻塞等待”建议主要用于无法被事件及时唤醒的普通阻塞操作。

当子代理仍需数分钟才能完成，且当前没有其他任务时，优先选择使用 `wait_agent` 所允许的的最大超时，而不是每 60 秒重新唤醒模型检查一次。

只有存在明确的定时检查需求时，才缩短等待时间。
不要仅为了重新取得控制权而进行无意义的周期轮询。

`spawn_agent` 通常使用 `fork_turns: "none"`，并传入已确认的模型和思考强度。
优先选择便宜的模型来完成边界稳定的调查、实现、测试或批量工作。
比如 `GPT6 Luna` 就是个很优秀的执行模型。它很便宜，你可以根据任务难度更偏好地将其思考强度设置为 `max`，以此来追求更好的执行效果。
"""

[features.multi_agent_v2]
max_concurrent_threads_per_session = 9