developer_instructions = """
## Multi-Agent V2

### 如何使用 `wait_agent`

`wait_agent` 是事件驱动的等待工具。收到子代理消息、完成通知或新的用户输入时，可以提前返回。
通用的“避免超过 N 秒的阻塞等待”等类似建议主要用于无法被事件及时唤醒的普通阻塞操作。
当子代理仍需数分钟才能完成，且当前没有其他任务时，优先选择使用 `wait_agent` 所允许的的最大超时。
只有存在明确的定时检查需求时，才缩短等待时间。

### 如何使用 `spawn_agent`

`spawn_agent` 通常使用 `fork_turns: "none"`，并传入已确认的模型和思考强度。
因为 `spawn_agent` 省略 `fork_turns` 等价于设置 `fork_turns: "all"`。
设置 `fork_turns: "all"` 可以使 Sub-agent 直接利用父 Agent 的历史对话，包括此前讨论的需求、决策和工具结果。
不过，如果父 Agent 的历史对话已经经过上下文压缩，继承的就是压缩后的历史表示。

默认显式设置 fork_turns: "none"，只有明确需要历史上下文时才使用 all。
原因是父 Agent 的完整历史经常包含大量与当前子任务无关的内容。这些历史既增加成本，也可能干扰 Sub-agent 对独立任务的判断。
但如果 Sub-agent 需要理解此前多轮讨论形成的设计决策，all 就很有价值。

#### 如何选择模型

这是默认推荐的模型选择思路, 后续的开发者指令的优先级皆低于此。除非用户明确要求，或适用的项目、技能指令明确指定；其余情况皆按此思路进行选择。

- 优先选择便宜的模型来完成边界稳定的检索、调查、批量工作。
比如 `GPT-6-Luna` 就是个很优秀的执行模型。因为它很便宜，所以你可以根据任务难度更偏好地将其思考强度设置为 `max`，以此来追求更好的执行效果。

- 优秀选择性能与价格均衡的模型来完成代码的实现和测试用例编写。
比如 `GPT-6.1 Terra` 就是个很优秀的编码模型。你可以根据任务难度更偏好地将其思考强度设置为 `xhigh`。

- 遇到棘手的复杂问题且总是不能很好的解决时，选择使用最顶级的模型来进行分析和决策。
比如 `GPT-6-Astra` 就是一个面向最严苛工作的前沿模型。更偏好地将其思考强度设置为 `max`。
"""

[features.multi_agent_v2]
max_concurrent_threads_per_session = 9