# 填写现场的实际绑定，只保留本实例接入的设备。
# 安装器自动将数据路径设置到 --target；其他字段保留。

[devices.action6]
kind = "camera"
driver = "dji-action6"

[devices.action6.adb]
serial = "REPLACE_ACTION6_SERIAL"

[devices.osmo360ii]
kind = "camera"
driver = "dji-osmo360-ii"

[devices.osmo360ii.adb]
serial = "REPLACE_OSMO360II_SERIAL"

[devices.hasselblad]
kind = "camera"
driver = "hasselblad_cfv100c"

[devices.hasselblad.hasselblad]
executable = "/opt/hb_cli/hb_cli"
serial = "REPLACE_HASSELBLAD_SERIAL"
product_id = 10
output_storage = "host"

# 下列预算可按现场设备响应和文件大小调整。
[devices.hasselblad.recording]
start_timeout_s = 30

[devices.hasselblad.connection]
prepare_lead_s = 30

[devices.hasselblad.result_check]
call_timeout_s = 180
